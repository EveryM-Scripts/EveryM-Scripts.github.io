<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EveryM | FiveM Scripts</title>
  <link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.png" type="image/x-icon">
</head>
<body>



  <h2 id="scriptsdsc">Developed for those who seek Functionality & Customization.</h2>
  <div class="scriptsearch" contenteditable="true" spellcheck="false" data-placeholder="Search Scripts..."></div>
<div id="headerbar">
    <a id="home" class="headerbtns" href="index.html">Home</a>
    <a id="scripts" class="headerbtns" href="scripts.html">Scripts</a>
    <a id="docs" class="headerbtns" href="docs.html">Docs</a>
    <a id="support" class="headerbtns" href="support.html">Support</a>
    <div id="underlines">
            <div id="homeline"></div>
            <div id="scriptsline"></div>
            <div id="docsline"></div>
            <div id="supportline"></div>
    </div>
</div>
<div id="scriptscontainer">
  <div id="filterbox">
    <div id="filtertitle">Filters</div>
    <div id="categorytitle">Category</div>
    <div id="categorybox">
          <div class="filteroption" id="categoryall" data-filter="all">All</div>
    <div class="filteroption" id="categoryadmin" data-filter="admin">Admin</div>
    <div class="filteroption" id="categoryvehicle" data-filter="vehicle">Vehicle</div>
    <div class="filteroption" id="categoryfun" data-filter="fun">Fun</div>
    <div class="filteroption" id="categoryui" data-filter="ui">UI</div>
    <div class="filteroption" id="categoryutility" data-filter="utility">Utility</div>
    <div class="filteroption" id="categoryother" data-filter="other">Other</div>
    </div>

  </div>
  <div id="scriptsbox">
    <div class="product" id="everymmenu" data-category="all ui">
      <div id="everymmenuimg"></div>
    </div>
  </div>
  
</div>
<div id="background"></div>


  <script src="script.js" defer></script>
</body>
</html>
